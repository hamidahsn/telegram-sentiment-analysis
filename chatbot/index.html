<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Sentiment Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h2>Telegram Sentiment Chatbot</h2>
            <p>Analisis pesan Telegram dengan Machine Learning</p>
        </div>


        <!-- Area percakapan -->
        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Halo! 👋 Saya chatbot analisis Telegram.
                Silakan kirim pesan atau minta saya menganalisis sentimen.
            </div>

        </div>


        <!-- Input -->
        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Ketik pesan..."
            >

            <button onclick="sendMessage()">
                Kirim
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
